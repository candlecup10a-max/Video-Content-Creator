<div class="min-h-screen flex flex-col bg-stone-50 text-stone-900 selection:bg-amber-200 selection:text-stone-900">
  <app-header />

  <main class="flex-1 pb-16">
    @switch (service.activeTab()) {
      @case ('ideation') {
        <app-idea-generator />
      }
      @case ('schedule') {
        <app-shoot-schedule />
      }
      @case ('captions') {
        <app-caption-separator />
      }
      @case ('package') {
        <app-social-distributor />
      }
      @case ('saved') {
        <app-saved-library />
      }
    }
  </main>

  <footer class="border-t border-stone-200 py-6 bg-white text-center text-xs text-stone-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 font-semibold text-stone-800">
        <img
          src="/logo.png"
          alt="Video Content Creator"
          class="w-6 h-6 rounded-md object-contain border border-stone-200/80 p-0.5 bg-white shadow-2xs"
          referrerpolicy="no-referrer"
        />
        <span>Video Content Creator</span>
        <span class="hidden sm:inline text-stone-300">•</span>
        <span class="text-[11px] font-medium text-stone-500">Capture | Create | Inspire</span>
      </div>
      <p>Ideate video concepts, craft hooks & publish across LinkedIn, Facebook, TikTok, and Twitter / X</p>
    </div>
  </footer>
</div>
